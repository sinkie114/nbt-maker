# Runs the client game tests in src/gametest inside a real (virtual-display)
# Minecraft client, so every push and pull request is checked in game, not
# only compiled. The "with SEE" run downloads SEE's latest release and adds
# the linked-editing suite in src/seeGametest.

name: client gametest
on: [pull_request, push]

jobs:
  client-gametest:
    name: client gametest (${{ matrix.see && 'with SEE' || 'standalone' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        see: [false, true]
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: download SEE release
        if: matrix.see
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo sinkie114/see --pattern 'see-*.jar' --dir build/see-compat
          ls -l build/see-compat
      # Loom already wraps the game in xvfb-run on CI. Software rendering gets
      # two threads so world generation keeps CPU time.
      - name: run client game tests
        shell: bash
        env:
          WITH_SEE: ${{ matrix.see }}
          LP_NUM_THREADS: '2'
        run: |
          chmod +x ./gradlew
          echo "CPU cores: $(nproc)"
          args=()
          if [ "$WITH_SEE" = "true" ]; then
            jar=$(ls "$PWD"/build/see-compat/see-*.jar | grep -v -- '-sources' | head -n 1)
            args+=("-PseeCompatJar=$jar")
          fi
          # Occasionally the integrated server stalls while preparing the spawn
          # area on hosted runners, even for unchanged code. Only that exact
          # failure is retried; every other failure fails the job at once.
          for attempt in 1 2 3; do
            if ./gradlew runClientGameTest "${args[@]}" --stacktrace 2>&1 | tee gametest.log; then exit 0; fi
            grep -q "Timeout loading world" gametest.log || exit 1
            echo "::warning::World loading timed out on attempt $attempt; retrying"
          done
          exit 1
      - name: upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-gametest-${{ matrix.see && 'with-see' || 'standalone' }}
          path: |
            build/run/clientGameTest/screenshots/
            build/run/clientGameTest/logs/
            build/run/clientGameTest/crash-reports/
          if-no-files-found: ignore
